version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qa_postgres
    environment:
      POSTGRES_DB: qa_generator
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: qa_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: qa_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL for the postgres service}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set a private random SECRET_KEY}
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
    depends_on:
      - postgres
      - redis

  celery_worker:
    build: ./backend
    container_name: qa_celery_worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL for the postgres service}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:?Set a private random SECRET_KEY}
    depends_on:
      - postgres
      - redis

  frontend:

    build: ./frontend
    container_name: qa_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
